<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10454f" />
    <title>Time Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1>Time Tracker</h1>
        <p>Mobile-first, local-only, no backend.</p>
      </header>

      <section class="panel hero">
        <div class="timer-wrap">
          <p class="label">Current Session</p>
          <p id="liveTimer" class="timer">00:00:00</p>
          <p id="sessionMeta" class="meta">Stopped</p>
        </div>

        <div class="controls">
          <button id="startStopBtn" class="btn primary" type="button">Start</button>
          <div class="mode-switch" role="group" aria-label="Mode">
            <button id="modeWorkBtn" class="btn mode active" data-mode="work" type="button">
              Work
            </button>
            <button id="modeBreakBtn" class="btn mode" data-mode="break" type="button">
              Break
            </button>
          </div>
        </div>

        <label class="field">
          <span>Project</span>
          <input id="projectInput" list="projectList" placeholder="General" maxlength="80" />
          <datalist id="projectList"></datalist>
        </label>
      </section>

      <section class="stats-grid">
        <article class="panel stat">
          <p class="label">Total Worked</p>
          <p id="totalWorked" class="value">0h 0m</p>
        </article>
        <article class="panel stat">
          <p class="label">Year Avg / Active Week</p>
          <p id="yearAvg" class="value">0h 0m</p>
        </article>
        <article class="panel stat">
          <p class="label">Week So Far</p>
          <p id="weekSoFar" class="value">0h 0m</p>
        </article>
        <article class="panel stat">
          <p class="label">Day So Far</p>
          <p id="daySoFar" class="value">0h 0m</p>
        </article>
      </section>

      <details class="panel accordion" open>
        <summary>Project Time Breakdown</summary>
        <div class="project-times-wrap">
          <table class="project-table" aria-label="Project time totals">
            <thead>
              <tr>
                <th scope="col">Project</th>
                <th scope="col">Day</th>
                <th scope="col">Week</th>
                <th scope="col">Total</th>
              </tr>
            </thead>
            <tbody id="projectTimesBody"></tbody>
          </table>
        </div>
      </details>

      <details class="panel accordion">
        <summary>Settings</summary>
        <div class="settings-grid">
          <label class="field">
            <span>Target Hours / Week</span>
            <input id="targetHoursInput" type="number" min="1" step="0.5" />
          </label>
          <label class="field">
            <span>Allowed Break Minutes / 8h Work</span>
            <input id="breakCapInput" type="number" min="0" step="1" />
          </label>
        </div>
        <button id="saveSettingsBtn" class="btn" type="button">Save Settings</button>
        <p id="settingsHint" class="hint"></p>
      </details>

      <details class="panel accordion">
        <summary>Data</summary>
        <div class="actions-grid">
          <button id="exportBtn" class="btn" type="button">Export JSON</button>
          <button id="exportProjectCsvBtn" class="btn" type="button">Export Project CSV</button>
          <label class="btn file-btn" for="importInput">Import JSON</label>
          <input id="importInput" type="file" accept="application/json" hidden />
        </div>
        <p id="dataHint" class="hint"></p>
      </details>
    </main>

    <script src="app.js"></script>
  </body>
</html>
