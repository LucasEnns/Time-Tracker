<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8f0ff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1520" />
    <title>Time Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="top-actions">
          <button id="projectOpenBtn" class="btn menu-btn" type="button">Projects</button>
          <button id="settingsOpenBtn" class="btn menu-btn" type="button">Settings</button>
        </div>
      </header>

      <section class="panel hero">
        <div class="timer-wrap">
          <p class="label">Time Tracker</p>
          <p id="liveTimer" class="timer">00:00:00</p>
        </div>

        <div class="controls">
          <button id="startStopBtn" class="btn primary clock-btn" type="button">Clock In</button>
        </div>

        <label class="field project-main-field">
          <span>Active Project</span>
          <div class="project-input-wrap">
            <input
              id="projectInput"
              type="text"
              placeholder="General"
              maxlength="80"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false" />
            <div
              id="projectDropdown"
              class="project-dropdown"
              role="listbox"
              aria-label="Recent projects"></div>
          </div>
        </label>
      </section>

      <section class="stats-grid">
        <article class="panel stat">
          <p class="label">Avg / Active Week (Since Start)</p>
          <p id="yearAvg" class="value">0h 0m</p>
          <div class="stat-subrow">
            <p class="subkey">Since Start Over / Under</p>
            <p id="yearDelta" class="subvalue">0h 0m</p>
          </div>
        </article>
        <article class="panel stat">
          <p class="label">Week So Far</p>
          <p id="weekSoFar" class="value">0h 0m</p>
          <div class="stat-subrow">
            <p class="subkey">Week Over / Under Target</p>
            <p id="weekDelta" class="subvalue">0h 0m</p>
          </div>
        </article>
        <article class="panel stat">
          <p class="label">Day So Far</p>
          <p id="daySoFar" class="value">0h 0m</p>
          <div class="stat-subrow">
            <p class="subkey">Paid Break Added Today</p>
            <p id="dayBreakBonus" class="subvalue">0h 0m</p>
          </div>
        </article>
      </section>
    </main>

    <aside id="projectOverlay" class="menu-overlay" aria-hidden="true">
      <section class="menu-sheet">
        <header class="menu-header">
          <h2>Projects</h2>
          <button id="projectCloseBtn" class="btn menu-btn" type="button">Close</button>
        </header>

        <section class="menu-section">
          <h3>Project Totals</h3>
          <div id="projectBreakdownList" class="project-breakdown-list"></div>
          <div class="actions-grid">
            <button id="exportProjectCsvBtn" class="btn" type="button">Export Project CSV</button>
          </div>
          <p id="projectDataHint" class="hint"></p>
        </section>
      </section>
    </aside>

    <aside id="settingsOverlay" class="menu-overlay" aria-hidden="true">
      <section class="menu-sheet">
        <header class="menu-header">
          <h2>Settings</h2>
          <button id="settingsCloseBtn" class="btn menu-btn" type="button">Close</button>
        </header>

        <section class="menu-section">
          <h3>Tracking</h3>
          <div class="settings-grid">
            <label class="field">
              <span>Target Hours / Week</span>
              <input id="targetHoursInput" type="number" min="1" step="0.5" />
            </label>
            <label class="field">
              <span>Tracking Start Date</span>
              <input id="startDateInput" type="date" />
            </label>
            <label class="field">
              <span>Paid Break Every (hours)</span>
              <input id="breakIntervalHoursInput" type="number" min="0.25" step="0.25" />
            </label>
            <label class="field">
              <span>Paid Break Length (minutes)</span>
              <input id="paidBreakMinutesInput" type="number" min="0" step="1" />
            </label>
          </div>
          <button id="saveSettingsBtn" class="btn" type="button">Save Settings</button>
          <p id="settingsHint" class="hint"></p>
        </section>

        <section class="menu-section">
          <h3>Data</h3>
          <div class="actions-grid">
            <button id="exportBtn" class="btn" type="button">Export JSON</button>
            <label class="btn file-btn" for="importInput">Import JSON</label>
            <input id="importInput" type="file" accept="application/json" hidden />
          </div>
          <p id="jsonHint" class="hint"></p>
        </section>
      </section>
    </aside>

    <script src="app.js"></script>
  </body>
</html>
